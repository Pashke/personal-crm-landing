# owner: personal-crm-landing (deploy/nginx/whobook.ru.conf)
# nginx config of the landing whobook.ru. The copy in git is the source; on the server it lives in
# /etc/nginx/sites-available/whobook.ru.conf and is installed by deploy/install-nginx.sh (as root).
# GitHub Actions deploys only the site files, not this config.
# It replaces the stub of the app's server setup and has no marker of it, so the app's setup.sh leaves it alone.

server {
    listen 80;
    server_name whobook.ru;
    # No nginx version in the Server header and on error pages.
    server_tokens off;
    include snippets/whobook-acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name whobook.ru;
    include snippets/whobook-ssl.conf;

    # No nginx version in the Server header and on error pages.
    server_tokens off;

    root /var/www/whobook.ru;
    index index.html;

    # Security headers; "always" adds them to error pages (404 and so on) too.
    # An add_header inside a location would drop all of these for that location: keep them here only.
    #   HSTS: for a year the browser opens whobook.ru only over HTTPS. Subdomains (the app) are not included.
    #   CSP: everything from this site only; inline scripts and styles are allowed (no nonce);
    #        no plugins, no <base> to other sites, forms only to this site, no embedding in frames.
    #   X-Frame-Options: no embedding in frames, for browsers without frame-ancestors.
    #   nosniff: the browser trusts Content-Type and does not guess the file type.
    #   Referrer-Policy: other sites (the app too) get only https://whobook.ru/, not the full address.
    #   Permissions-Policy: the page asks for no camera, microphone, location, payments and so on.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
